Section "Device"
    Identifier "fbdev"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "false"
EndSection

Section "Screen"
    Identifier "screen"
    Device "fbdev"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        FbBpp 32
        Weight 8 8 8
        Modes "720x1280"
    EndSubSection
EndSection
