# gpu31 CI defaults. Sourced by ci.sh (POSIX sh). Every value below can be
# overridden from the environment, e.g. SCRATCH=/path sh ci.sh.
# Rule: SCRATCH/OUT MUST be on the external drive (host /tmp is a small
# tmpfs; big files go to /data on the phone, external disk on the host).
# The shared kernel tree ($KDIR) is NEVER written — CI works on $SCRATCH.

# Read-only shared tree (LineageOS android_kernel_samsung_universal7580).
KDIR=${KDIR:-/run/media/asdf/db69437b-ed35-414a-8bd1-bade16b06830/j7k/android_kernel_samsung_universal7580-2a746c1bc1a41eae05988c153f527c8a5dc72d07}
# Private scratch tree (created by stage S2 from $KDIR; owned by this CI).
SCRATCH=${SCRATCH:-/run/media/asdf/db69437b-ed35-414a-8bd1-bade16b06830/j7k/gpu31/scratch-ci}
# Stock defconfig base.
STOCK_REL=code/pmaports/device/archived/linux-samsung-j7elte/config-samsung-j7elte.aarch64
# Generated series dir (copies of patches/*; see package/regen-series.sh).
SERIES_REL=code/gpu31/series
# Kconfig fragment merged on top of stock (D0 = proven M1 6-symbol set).
FRAG_REL=code/gpu31/config/fragments/d0-m1-minimal.fragment
# M1 reference fragment the D0 set must stay symbol-identical to.
M1FRAG_REL=code/gpu31/series/m1-kconfig.fragment
# Required link symbols (one per line, checked in stage S5).
SYMBOLS_REL=code/gpu31/ci/symbols.list

# Series apply order: backport foundation first, display code last.
# Display patch 0001 is CODE ONLY (0002 DT patch is never applied: stock
# dt.img is always reused, vendor EXYNOS_DECON_FB stays master).
SERIES_ORDER="0001-dma-fence-minimal-subset.patch 0002-dma-resv-shim.patch 0003-drm_syncobj-subset.patch 0004-drm_sched-panfrost-job-only-shim.patch 0005-build-wiring-for-shims.patch 0001-drm-exynos7580-decon-dsim-kms.patch"

# Boot-image assembly (stock ramdisk/dt/cmdline reused; semantics match
# code/kernel/build.sh; dt.img is NEVER rebuilt).
MKBOOT=${MKBOOT:-/tmp/mkboot.py}
BIMG_DT=${BIMG_DT:-/tmp/bimg/dt.img}
BIMG_RD=${BIMG_RD:-/tmp/bimg/ramdisk-new.gz}
BIMG_CMD=${BIMG_CMD:-/tmp/bimg/cmdline}

# Build settings (serial: -jN died in kernel/irq on a Broken-pipe artifact).
JOBS=${JOBS:-1}
KCFLAGS=${KCFLAGS:--Wno-error}
CROSS=${CROSS:-aarch64-linux-gnu-}

# Output root (logs, Image copy, boot.img + .sha256, verdicts).
OUT=${OUT:-/run/media/asdf/db69437b-ed35-414a-8bd1-bade16b06830/j7k/gpu31/ci-out}

# Device post-flash access (flash itself stays MANUAL; this CI never runs
# dd/reboot — postflash stages are read-only checks under short flock holds).
DEVICE=${DEVICE:-user@172.16.42.1}
LOCK=${LOCK:-/tmp/gpsdev.lock}
SSH_ASKPASS=${SSH_ASKPASS:-/tmp/ap.sh}
