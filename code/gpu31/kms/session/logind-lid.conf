# Nura session stack: elogind drop-in.
# Installed as /etc/elogind/logind.conf.d/60-nura-lid.conf.
#
# The hall sensor is seen by elogind as a lid switch.  The nura-shell image
# held an inhibitor to avoid the default suspend-on-lid behaviour because
# suspend/resume is not validated on this vendor kernel.  Keep that policy
# for Plasma Mobile; explicit suspend from the power menu still works.
[Login]
HandlePowerKey=ignore
HandleLidSwitch=ignore
