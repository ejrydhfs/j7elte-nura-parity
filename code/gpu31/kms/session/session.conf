# /etc/nura/session.conf - shared settings for the Nura session selector.
# Sourced by /usr/local/bin/nura-session-mode and /usr/local/bin/nura-session-run.
NURA_SESSION_USER="user"
NURA_KMS_CARD="/dev/dri/card0"
NURA_KMS_PROBE="/usr/local/sbin/kms-atomic-probe"
NURA_PLASMA_DESKTOP="/usr/share/wayland-sessions/nura-plasma.desktop"
