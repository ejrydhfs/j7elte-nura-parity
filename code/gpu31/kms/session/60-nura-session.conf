# Nura session stack: Plasma Mobile autologin on the DECON KMS card.
# Installed as /etc/lightdm/lightdm.conf.d/60-nura-session.conf.
#
# LightDM 1.33 has no autologin path of its own: the seat only forwards the
# autologin hints to the greeter when autologin-user-timeout > 0
# (src/seat.c), and slick-greeter performs the login.  A timeout of 0
# disables autologin entirely.

[LightDM]
logind-check-graphical=true

[Seat:*]
autologin-user=user
autologin-user-timeout=1
autologin-session=nura-plasma
user-session=nura-plasma
session-wrapper=/usr/local/bin/nura-plasma-wrapper

# The greeter is X11.  Keep it on the KMS fbdev emulation so it never holds
# DRM master on card0 at the moment KWin starts.  If a later KMS slice drops
# fb0, delete this line and let Xorg auto-configure (modesetting).
xserver-command=X -config /etc/X11/xorg.conf.d/99-fbdev.conf
