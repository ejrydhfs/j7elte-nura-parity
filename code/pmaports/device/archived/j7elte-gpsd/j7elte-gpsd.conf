# j7elte-gpsd options
#
# Read by both /etc/init.d/j7elte-gpsd (OpenRC) and
# usr/lib/systemd/system/j7elte-gpsd.service (systemd).
#
# The defaults below mirror the vendor configuration in /system/etc/gps.xml:
#   PortName          = /dev/ttySAC0   -> --device
#   BaudRate          = 921600         -> --baud
#   GpioNStdbyPath    = /sys/class/sec/gps/GPS_PWR_EN/value -> --gpio
#   GpioDelayMs       = 250            -> --power-delay
#
# The BCM4752 does not free-run NMEA.  Add --init to replay the part of
# Broadcom's BRI bring-up that was recovered from /system/bin/gpsd
# (autobaud burst, GetOutOfLegacy, HwVersion, DebugSfr):
#   J7ELTE_GPSD_OPTS="$J7ELTE_GPSD_OPTS --init"
# See parity/reports/gps-init-impl.md for what is still missing after it.
#
# Handy additions when debugging:
#   --init               send the recovered BCM4752 BRI handshake first
#   --verbose            log every NMEA sentence
#   --raw-log /tmp/gps.rx  dump every received byte (what the chip *really* sends)
#   --probe-baud         retry 9600/115200/4800 if the vendor rate stays silent
#
J7ELTE_GPSD_OPTS="--device /dev/ttySAC0 --baud 921600 --gpio /sys/class/sec/gps/GPS_PWR_EN/value --power-delay 250 --rundir /run/j7elte-gpsd"
#
# Consuming the data
# ------------------
# The daemon exposes NMEA 0183 in two ways:
#
#   1. a PTY with a stable path:  /run/j7elte-gpsd/tty
#      gpsd can be pointed straight at it, e.g. /etc/conf.d/gpsd:
#          GPSD_OPTIONS="-n /run/j7elte-gpsd/tty"
#      (start j7elte-gpsd before gpsd; the PTY stays valid for the whole
#      lifetime of the daemon, gpsd re-opens it on restart of j7elte-gpsd only)
#
#   2. a Unix stream socket:      /run/j7elte-gpsd/nmea.sock
#      one NMEA sentence per line per connected client, for any other
#      consumer (a few tools prefer a socket over a tty).
