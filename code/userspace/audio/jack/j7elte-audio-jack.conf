# Configuration for j7elte-audio-jack.
#
# The daemon reads the jack type from
# /sys/class/switch/<switch>/state, where the vendor sec_jack driver
# reports enum sec_jack_type (include/linux/sec_jack.h:20-25):
#
#   0 = no jack            1 = 4-pole headset (with mic)
#   2 = 3-pole headphone   4 = external antenna (treated as "no jack")
#
# For every state it enables the matching playback/capture device of the
# UCM2 profile installed by j7elte-audio-ucm ("set _verb HiFi", then
# "set _enadev <out>" and "set _enadev <in>" through alsaucm).

# ALSA card name or id.  "hw:0" is the safe invocation; the card id
# derived from the shortname is "Universal7580I2S".
card = hw:0

# UCM2 verb to select before touching the devices.
verb = HiFi

# Android switch class device name registered by drivers/misc/sec_jack.c.
+# Leave empty to use /sys/class/switch/<switch>/state.
switch = h2w

# Optional full path override for the state attribute (empty = derived
# from "switch" above).  Only useful for tests; the kernel interface is
# /sys/class/switch/h2w/state.
state_file =

# A new jack state is only committed when it is still present after this
# long.  sec_jack already debounces the detect GPIO (det-dbtime = 50 ms in
# the j7elte DT) and the ADC zones (10 samples x 10 ms), so this is a
# second, userspace-level debounce for slow inserts and dirty contacts.
settle_ms = 300

# Re-read the switch state periodically even without a uevent, to catch a
# lost uevent, a switch device that appears after the daemon, or a mixer
# that was changed behind our back.  0 disables the periodic re-read.
poll_ms = 5000

# Retry interval after a failed alsaucm/amixer application.
retry_ms = 5000

# Timeout for every alsaucm/amixer invocation (killed on expiry).
cmd_timeout_ms = 5000

# Verify the resulting mixer state with "amixer cget" and fall back to
# plain amixer writes (ROM default values) when UCM application fails.
verify = yes

# Absolute paths of the helpers (alsaucm and amixer are both in
# alsa-utils).
alsaucm = /usr/bin/alsaucm
amixer = /usr/bin/amixer

# Optional program run after a successful route change.  It receives the
# jack state, the output device and the input device as arguments, e.g.
#   hook = /usr/local/bin/j7elte-jack-notify
hook =

# Jack state -> UCM2 device.  Playback and capture devices are enabled
# together; the UCM sequences are independent (playback touches
# HP/EP/SPK and the S2801 mixer, capture touches the ADC mixers).
out_0 = Speaker
in_0 = Mic

out_1 = Headphones
in_1 = Headset Mic

out_2 = Headphones
in_2 = Mic

# External-antenna detection (state 4) must never route audio to a
# transducer that is not there.
out_4 = Speaker
in_4 = Mic
